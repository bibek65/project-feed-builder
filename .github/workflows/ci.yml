name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Run tests
        run: npm test
      - name: Typecheck
        run: npm run lint
      - name: Build feed
        run: npm run build && npm run feed -- examples/projects dist/projects.json
      - name: Assemble preview bundle
        run: npm run preview:bundle
      - name: Upload preview bundle
        uses: actions/upload-artifact@v4
        with:
          name: preview-bundle
          path: preview-bundle
          if-no-files-found: error
